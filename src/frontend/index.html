<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Vet Reminder App</title>
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src http://localhost:3000">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- Header -->
    <header>
      <h1>🐾 Vet Reminder</h1>
      <p>Manage pet appointments and automatic reminders</p>
    </header>

    <!-- Main content -->
    <div class="container">
      <!-- Left Panel: Forms -->
      <div>
        <!-- Add Client Form -->
        <div class="panel">
          <h2>Add New Client</h2>
          <div id="clientMessage" class="message"></div>
          
          <div class="form-group">
            <label>Owner Name</label>
            <input type="text" id="clientName" placeholder="First name">
          </div>

          <div class="form-group">
            <label>Owner Surname</label>
            <input type="text" id="clientSurname" placeholder="Last name">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="clientEmail" placeholder="owner@example.com">
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="clientPhone" placeholder="+30 6XX XXX XXXX">
          </div>

          <button onclick="addClient()">Add Client</button>
        </div>

        <!-- Add Appointment Form -->
        <div class="panel" style="margin-top: 20px;">
          <h2>Schedule Appointment</h2>
          <div id="appointmentMessage" class="message"></div>

          <div class="form-group">
            <label>Select Client</label>
            <select id="appointmentClient">
              <option value="">-- Choose a client --</option>
            </select>
          </div>

          <div class="form-group">
            <label>Pet Name</label>
            <input type="text" id="petName" placeholder="Buddy, Whiskers, etc.">
          </div>

          <div class="form-group">
            <label>Pet Type</label>
            <select id="petType">
              <option value="">-- Select type --</option>
              <option value="Dog">Dog</option>
              <option value="Cat">Cat</option>
              <option value="Bird">Bird</option>
              <option value="Rabbit">Rabbit</option>
              <option value="Hamster">Hamster</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label>Next Shot Date</label>
            <input type="date" id="shotDate">
          </div>

          <button onclick="addAppointment()">Schedule Appointment</button>
        </div>
      </div>

      <!-- Right Panel: Lists -->
      <div class="list-container">
        <!-- Clients List -->
        <div class="list-section">
          <h2>Registered Clients</h2>
          <table id="clientsTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <div id="noClients" class="empty">No clients yet. Add one to get started.</div>
        </div>

        <!-- Appointments List -->
        <div class="list-section">
          <h2>Upcoming Appointments</h2>
          <table id="appointmentsTable">
            <thead>
              <tr>
                <th>Client</th>
                <th>Pet</th>
                <th>Type</th>
                <th>Shot Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <div id="noAppointments" class="empty">No appointments scheduled yet.</div>
        </div>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
  </body>
</html>
